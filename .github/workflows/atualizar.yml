name: Atualizar o Calendário TJMG

on:
  schedule:
    - cron: "0 9 * * 1"   # toda segunda-feira, 06h00 de Brasília
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atualizar
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Baixar as páginas do TJMG e a população do IBGE
        run: python -X utf8 baixar.py
      - name: Coletar a composição das comarcas no Guia Judiciário
        # falha aqui não derruba a passada: vale a última coleta boa, que está no repositório
        run: python -X utf8 coletar_guia.py || echo "::warning::coleta do Guia não concluiu; mantida a anterior"
      - name: Calcular e gerar os dados
        run: python -X utf8 gerar.py
      - name: Publicar o que mudou
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A paginas docs guia-comarcas.json guia-pesquisa.html ibge-populacao-estimada.json ibge-populacao-censo-2022.json RESUMO.txt
          git diff --cached --quiet && echo "nada mudou" || (git commit -m "Atualização semanal a partir do TJMG e do IBGE" && git push)
